image: maven:3.8.5-openjdk-17

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  SPRING_PROFILES_ACTIVE: gitlab-ci 
  
stages:
  - test
  - deploy
  - pages

cache:
  key: "${CI_JOB_NAME}" # Keep cache across branches 
  paths:
    - .m2/repository 

test:jdk17:
  stage: test
  script:
    - mvn clean test # Cleans the previous build and runs tests.
  artifacts:
    when: always
    paths:
      - target/site/jacoco # We need to save the HTML-reports that Jacoco produces, so we can serve it on Gitlab Pages in the next stage
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml # Unit tests
        - target/failsafe-reports/TEST-*.xml # Integration tests
  when: always
    
generate_site_reports:
  stage: deploy
  script:
    - mvn site
  artifacts:
    when: always
    paths:
      - target/site/

# We move the code coverage reports generated by jacoco (see pom.xml) to be served by Gitlab Pages (Settings -> Pages)
pages:
  image: alpine:latest
  stage: pages
  dependencies:
    - generate_site_reports # Ensures that the reports generated are available to this job
  script:
    - mkdir public
    - cp -r target/site/* public/ # Copies all generated site content to the public folder for GitLab Pages
  artifacts:
    paths:
      - public
