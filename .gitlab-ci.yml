image: maven:3.8.5-openjdk-17

variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "testimage"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  SPRING_PROFILES_ACTIVE: gitlab-ci 
  
cache:
  key: "${CI_COMMIT_REF_SLUG}" # Branch-specific cache keys to have separate caches across branches.
  paths:
    - .m2/repository

stages:
  - build_test
  - generate_site_reports
  - modify_generated_site_reports
  - pages
  - docker_build_and_push
  - deploy

build_test_project:
  stage: build_test
  services:
    - name: mysql:latest
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: "root"  
        MYSQL_DATABASE: "sparesti"
  script:
    - mvn clean test
  when: always
  artifacts:
    expire_in: 1 day
    paths:
      - target/site/jacoco
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

generate_site_reports:
  stage: generate_site_reports
  script:
    - mvn site # Generates a website containing project documentation (including checkstyle report)
  artifacts:
    paths:
      - target/site/
  only:
    - master

modify_generated_site_reports: # Modify the generated website containing project documentation to also link to JaCoCo coverage file
  image: python:3.8-slim
  stage: modify_generated_site_reports
  script:
    - pip install beautifulsoup4 # Used to parse contents of HTML files
    - python scripts/add_jacoco_coverage_link_to_html.py # Script that modifies the HTML file to include a link to JaCoCo coverage file
  artifacts:
    paths:
      - target/site/
  dependencies:
    - generate_site_reports
  only:
    - master

# We move the code coverage reports generated by jacoco and mvn site to be served by Gitlab Pages (Settings -> Pages)
pages:
  image: alpine:latest
  stage: pages
  dependencies:
    - modify_generated_site_reports
  script:
    - mkdir public
    - cp -r target/site/* public/
  artifacts:
    paths:
      - public
  only:
    - master  

docker_build_and_push:
  stage: docker_build_and_push
  image: docker:latest
  services:
    - docker:dind
  tags:
    - dind
  script:
    - docker login -u henrikberg -p glpat-YvYeLgDcN_NgquinYKGH registry.gitlab.com
    - docker build -t registry.gitlab.com/henrikberg/sparesti-registry:backend .
    - docker push registry.gitlab.com/henrikberg/sparesti-registry:backend
  when: manual


deploy_docker:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - apt-get install sshpass
  script: 
    - sshpass -p sParest1en ssh -v -o StrictHostKeyChecking=no root@128.199.53.153 "docker ps -q --filter 'name=^backend$' | grep -q . && docker kill backend && docker rm backend; docker run -d --name backend registry.gitlab.com/henrikberg/sparesti-registry:backend"
  when: manual

