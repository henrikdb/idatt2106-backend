image: maven:3.8.5-openjdk-17

variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "testimage"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  SPRING_PROFILES_ACTIVE: gitlab-ci 
  
cache:
  key: "${CI_COMMIT_REF_SLUG}" # Branch-specific cache keys to have separate caches across branches.
  paths:
    - .m2/repository

stages:
  - build_test
  - pages
  - docker_build_and_push
  - deploy

build_test_project:
  stage: build_test
  services:
    - name: mysql:latest
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: "root"  
        MYSQL_DATABASE: "sparesti"
  script:
    - mvn clean test
  when: always
  artifacts:
    expire_in: 1 day
    paths:
      - target/site/jacoco
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

# We move the code coverage reports generated by jacoco to be served by Gitlab Pages (Settings -> Pages)
pages:
  image: alpine:latest
  stage: pages
  script:
    - mkdir public
    - cp -r target/site/jacoco/* public/
  artifacts:
    paths:
      - public
  only:
    - master  

docker_build_and_push:
  stage: docker_build_and_push
  image: docker:latest
  services:
    - docker:dind
  tags:
    - dind
  script:
    - docker login -u $DOCKER_USER -p $DOCKER_PAT registry.gitlab.com
    - docker build -t registry.gitlab.com/$DOCKER_USER/sparesti-registry:backend .
    - docker push registry.gitlab.com/$DOCKER_USER/sparesti-registry:backend
  when: manual
  only:
    - master 

deploy_docker:
  stage: deploy
  image: ubuntu:latest
  dependencies:
    - docker_build_and_push
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - apt-get install sshpass
  script: 
    - sshpass -p sParest1en ssh -v -o StrictHostKeyChecking=no root@128.199.53.153 "docker ps -q --filter 'name=^backend$' || grep -q . && docker kill backend && docker rm backend; docker pull registry.gitlab.com/$DOCKER_USER/sparesti-registry:backend && docker run -d --name backend registry.gitlab.com/$DOCKER_USER/sparesti-registry:backend"
  when: manual
  only:
    - master 



