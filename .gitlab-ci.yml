image: docker:19-dind

variables:
  DOCKER_HOST: "tcp://docker:2375"  # Address of the Docker daemon
  DOCKER_TLS_CERTDIR: ""
  DOCKER_IMAGE: "registry.stud.idi.ntnu.no:5050/idatt2106-2024-07/backend:$CI_COMMIT_SHA"

services:
  - name: docker:dind
    alias: docker

stages:
  - build

build:
  stage: build
  script:
    - echo "Logging into Docker Registry"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.stud.idi.ntnu.no:5050  # Registry URL
    - echo "Building Docker Image"
    - docker build -t $DOCKER_IMAGE .
    - echo "Pushing Docker Image to Registry"
    - docker push $DOCKER_IMAGE
