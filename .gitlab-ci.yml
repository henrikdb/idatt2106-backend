image: maven:3.8.5-openjdk-17

variables:
  SPRING_PROFILES_ACTIVE: gitlab-ci 

cache:
  key: "${CI_COMMIT_REF_SLUG}" # Branch-specific cache keys to have separate caches across branches.
  paths:
    - .m2/repository
  
stages:
  - build_test
  - pages

build_test_project:
  stage: build_test
  services:
    - name: mysql:latest
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: "root"  
        MYSQL_DATABASE: "sparesti"
  script:
    - mvn clean test
  when: always
  artifacts:
    expire_in: 1 day
    paths:
      - target/site/jacoco
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

# We move the code coverage reports generated by jacoco to be served by Gitlab Pages (Settings -> Pages)
pages:
  image: alpine:latest
  stage: pages
  script:
    - mkdir public
    - cp -r target/site/jacoco public/
  artifacts:
    paths:
      - public
  only:
    - master       
