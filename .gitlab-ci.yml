image: docker:19-dind

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

services:
  - name: docker:dind
    alias: docker
    command: ["--mtu=1500"]  # Sometimes necessary to adjust MTU for networking issues

stages:
  - docker-build

Docker Build:
  stage: docker-build
  before_script:
    - docker info  # Check Docker daemon info to ensure connectivity
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --tag $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
