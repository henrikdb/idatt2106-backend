variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

stages:
  - deploy

Docker Build:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --tag $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE

deploy:
  stage: deploy
  image: ubuntu:latest
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - apt-get install sshpass
  script: 
    - sshpass -p sParest1en ssh -v -o StrictHostKeyChecking=no root@128.199.53.153 "fuser -k 8080/tcp; rm -rf backend; git clone https://gitlab.stud.idi.ntnu.no/idatt2106-2024-07/backend.git && cd backend && mvn clean install && mvn spring-boot:run"

