variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

stages:
  - docker-build
  - deploy

deploy:
  image: ubuntu:latest
  stage: deploy
  script:
    - ssh $ssh_user@$ssh_host "mkdir dab" -i "$ssh_private_key"
  after_script:
    - rm -rf ~/.ssh