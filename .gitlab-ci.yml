variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

stages:
  - deploy

deploy:
  stage: deploy
  image: dwdraju/ssh-client-alpine
  before_script:
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tSendEnv CI_*\n" > ~/.ssh/config
    - echo $ssh_private_key | tr -d '\r' > ~/.ssh/id_rsa  
    - chmod 700 ~/.ssh
    - chmod 600 ~/.ssh/id_rsa
    - cat ~/.ssh/id_rsa > id_rsa_contents.txt  # Save contents to a file
  script: 
    - ssh root@159.223.211.3 
