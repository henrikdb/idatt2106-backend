image: maven:3.8.5-openjdk-17

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  SPRING_PROFILES_ACTIVE: gitlab-ci 
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  
services:
  - name: mysql:latest
    alias: mysql
    variables:
      MYSQL_ROOT_PASSWORD: "root"  
      MYSQL_DATABASE: "sparesti"

  - name: docker:dind
    alias: docker
    variables:
      DOCKER_TLS_CERTDIR: ""
  
stages:
  - compile_and_test
  - docker-build
  - publish_pages

cache:
  key: "maven-repository" # Static Cache Key to keep cache across branches 
  paths:
    - .m2/repository

compile_and_test:
  stage: compile_and_test
  script:
    - mvn clean test # Cleans the previous build and runs tests
  artifacts:
    when: always
    paths:
      - target/site/jacoco
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  when: always

Docker Build:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - until docker info; do echo "Waiting for Docker to start..."; sleep 1; done
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --tag $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE

# We move the code coverage reports generated by jacoco and mvn site to be served by Gitlab Pages (Settings -> Pages)
pages:
  image: alpine:latest
  stage: publish_pages
  script:
    - mkdir public
    - cp -r target/site/* public/
  artifacts:
    paths:
      - public
  only:
    - master       
