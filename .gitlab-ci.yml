variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

stages:
  - docker-build
  - deploy

deploy:
  image: ubuntu:latest
  stage: deploy
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - install -m 600 -D /dev/null ~/.ssh/id_rsa
    - echo -n $ssh_private_key > ~/.ssh/id_rsa
    - chmod 700 ~/.ssh
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ssh root@159.223.211.3 -i /.ssh/id_rsa
  after_script:
    - rm -rf ~/.ssh
